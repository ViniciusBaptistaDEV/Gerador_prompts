<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#bg)"/>

  <!-- Corpo do chip -->
  <rect x="14" y="14" width="20" height="20" rx="3" stroke="#ffffff" stroke-width="2.4" fill="none"/>
  <rect x="19" y="19" width="10" height="10" rx="1.5" fill="#ffffff"/>

  <!-- Pinos superiores -->
  <line x1="19" y1="14" x2="19" y2="9" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="24" y1="14" x2="24" y2="9" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="29" y1="14" x2="29" y2="9" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Pinos inferiores -->
  <line x1="19" y1="34" x2="19" y2="39" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="24" y1="34" x2="24" y2="39" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="29" y1="34" x2="29" y2="39" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Pinos esquerda -->
  <line x1="14" y1="19" x2="9" y2="19" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="14" y1="24" x2="9" y2="24" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="14" y1="29" x2="9" y2="29" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Pinos direita -->
  <line x1="34" y1="19" x2="39" y2="19" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="34" y1="24" x2="39" y2="24" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="34" y1="29" x2="39" y2="29" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
</svg>
